<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • ThienPhuc</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f8fafc;font:15px Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:25px;font-weight:900}.brand b{color:#ffd84d}.card{background:#111318;border:1px solid #252832;border-radius:20px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,textarea,select,button{width:100%;padding:12px;border-radius:11px;border:1px solid #30343e;background:#0b0d11;color:white}button{cursor:pointer;background:#ffd84d;color:#151515;border:0;font-weight:800}.danger{background:#2a1417;color:#ff9da5}.row{display:grid;grid-template-columns:2fr 1fr 1fr 2fr 90px 90px;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #24262d}.order{grid-template-columns:1fr 1.5fr 1fr 1fr 1fr 1.2fr}.muted{color:#9298a5}.login{max-width:420px;margin:15vh auto}@media(max-width:800px){.grid,.row,.order{grid-template-columns:1fr}.wrap{padding:16px}}
</style></head><body><div class="wrap"><div id="login" class="card login"><h1>Admin</h1><p class="muted">Nhập mật khẩu quản trị</p><input id="pw" type="password" placeholder="Mật khẩu"><br><br><button onclick="login()">Đăng nhập</button></div><main id="app" hidden><div class="top"><div class="brand">THIENPHUC <b>ADMIN</b></div><button style="width:auto" onclick="logout()">Đăng xuất</button></div><div class="card"><h2>Thêm / sửa gói</h2><input id="pid" type="hidden"><div class="grid"><input id="name" placeholder="Tên gói"><input id="price" type="number" placeholder="Giá (VNĐ)"><input id="days" type="number" placeholder="Số ngày"><input id="sort" type="number" placeholder="Thứ tự"></div><br><textarea id="desc" placeholder="Mô tả"></textarea><br><br><label><input id="active" type="checkbox" checked style="width:auto"> Đang bán</label><br><br><button onclick="savePackage()">Lưu gói</button></div><div class="card"><h2>Danh sách gói</h2><div id="packages"></div></div><div class="card"><h2>Đơn mua</h2><div id="orders"></div></div></main></div><script>
let key=sessionStorage.adminKey||''; const H=()=>({'Content-Type':'application/json','x-admin-password':key});
async function login(){key=pw.value;let r=await fetch('/api/admin/packages',{headers:H()});if(!r.ok)return alert('Sai mật khẩu');sessionStorage.adminKey=key;show();}
function logout(){sessionStorage.removeItem('adminKey');location.reload()} function show(){login.hidden=true;app.hidden=false;load()}
async function load(){let [p,o]=await Promise.all([fetch('/api/admin/packages',{headers:H()}),fetch('/api/admin/orders',{headers:H()})]);if(p.status==401)return logout();renderPackages((await p.json()).packages);renderOrders((await o.json()).orders)}
function money(v){return Number(v).toLocaleString('vi-VN')+'đ'}
function renderPackages(a){packages.innerHTML=a.map(x=>`<div class="row"><b>${x.name}</b><span>${money(x.price)}</span><span>${x.duration_days} ngày</span><span class="muted">${x.description||''}</span><button onclick='edit(${JSON.stringify(x)})'>Sửa</button><button class="danger" onclick="del(${x.id})">Xóa</button></div>`).join('')||'<p class="muted">Chưa có gói.</p>'}
function edit(x){pid.value=x.id;name.value=x.name;price.value=x.price;days.value=x.duration_days;desc.value=x.description||'';sort.value=x.sort_order||0;active.checked=!!x.active;scrollTo({top:0,behavior:'smooth'})}
async function savePackage(){let b={id:pid.value?+pid.value:null,name:name.value,price:+price.value,duration_days:+days.value,description:desc.value,active:active.checked,sort_order:+sort.value||0};let r=await fetch('/api/admin/packages',{method:'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok)return alert('Không lưu được');pid.value='';name.value=price.value=days.value=desc.value=sort.value='';active.checked=true;load()}
async function del(id){if(!confirm('Xóa gói này?'))return;await fetch('/api/admin/packages/'+id,{method:'DELETE',headers:H()});load()}
function renderOrders(a){orders.innerHTML=a.map(x=>`<div class="row order"><b>${x.order_code}</b><span>${x.package_name||'-'}</span><span>${money(x.amount)}</span><span>${x.customer_name||x.user_id||'-'}</span><span>${x.contact||'-'}</span><select onchange="status(${x.id},this.value)">${['pending','paid','processing','completed','cancelled'].map(s=>`<option ${x.status==s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Chưa có đơn.</p>'}
async function status(id,status){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status})});load()}
if(key)show();
</script></body></html>
