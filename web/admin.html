<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • ThienPhuc</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#1b1b1b;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1220px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:24px;font-weight:950}.brand b{color:#c99b00}.card{background:#fff;border:1px solid #e7e2d6;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 12px 35px #6d58120b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,textarea,select,button{width:100%;padding:12px;border-radius:11px;border:1px solid #ddd7c9;background:#fff;color:#1b1b1b;font:inherit}textarea{min-height:80px;resize:vertical}button{cursor:pointer;background:#ffd633;border-color:#e9bd00;font-weight:850}.ghost{background:white}.danger{background:#fff0f0;color:#b42318;border-color:#ffd1d1}.row{display:grid;grid-template-columns:1.5fr .8fr .7fr 2fr 76px 76px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee9de}.order{grid-template-columns:1fr 1.3fr .8fr 1fr 1fr 1.1fr}.muted{color:#858585}.login{max-width:420px;margin:14vh auto}.section-title{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{width:auto;background:#fff}.tab.on{background:#171717;color:white;border-color:#171717}.pane{display:none}.pane.on{display:block}@media(max-width:820px){.grid,.grid2,.row,.order{grid-template-columns:1fr}.wrap{padding:12px}.top{align-items:flex-start}}
</style></head><body><div class="wrap"><div id="loginBox" class="card login"><h1>Quản trị</h1><p class="muted">Đăng nhập để quản lý giao diện, gói và đơn hàng.</p><input id="pw" type="password" placeholder="Mật khẩu admin"><br><br><button id="loginBtn">Đăng nhập</button></div><main id="app" hidden><div class="top"><div class="brand">THIENPHUC <b>ADMIN</b></div><button class="ghost" style="width:auto" onclick="logout()">Đăng xuất</button></div><div class="tabs"><button class="tab on" data-pane="site">Giao diện</button><button class="tab" data-pane="packs">Gói</button><button class="tab" data-pane="ordersPane">Đơn hàng</button></div><section id="site" class="pane on"><div class="card"><h2>Cấu hình website</h2><div class="grid2"><input id="site_name" placeholder="Tên website"><input id="tagline" placeholder="Tagline"><input id="hero_title" placeholder="Tiêu đề lớn"><input id="support_text" placeholder="Chữ nút hỗ trợ"></div><br><textarea id="hero_subtitle" placeholder="Mô tả trang chủ"></textarea><br><br><div class="grid"><input id="bank_name" placeholder="Ngân hàng"><input id="bank_account" placeholder="Số tài khoản"><input id="bank_owner" placeholder="Chủ tài khoản"><input id="support_url" placeholder="Link hỗ trợ"></div><br><button onclick="saveSite()">Lưu cấu hình</button></div></section><section id="packs" class="pane"><div class="card"><h2>Thêm / sửa gói</h2><input id="pid" type="hidden"><div class="grid"><input id="name" placeholder="Tên gói"><input id="price" type="number" placeholder="Giá (VNĐ)"><input id="days" type="number" placeholder="Số ngày"><input id="sort" type="number" placeholder="Thứ tự"></div><br><textarea id="desc" placeholder="Mô tả"></textarea><br><br><label><input id="active" type="checkbox" checked style="width:auto"> Đang hiển thị</label><br><br><button onclick="savePackage()">Lưu gói</button></div><div class="card"><h2>Danh sách gói</h2><div id="packages"></div></div></section><section id="ordersPane" class="pane"><div class="card"><h2>Đơn mua</h2><div id="orders"></div></div></section></main></div><script>
let key=sessionStorage.adminKey||'';const H=()=>({'Content-Type':'application/json','x-admin-password':key});const $=id=>document.getElementById(id);$('loginBtn').onclick=login;async function login(){key=$('pw').value;let r=await fetch('/api/admin/packages',{headers:H()});if(!r.ok)return alert('Sai mật khẩu');sessionStorage.adminKey=key;show()}function logout(){sessionStorage.removeItem('adminKey');location.reload()}function show(){$('loginBox').hidden=true;$('app').hidden=false;load()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('on'));t.classList.add('on');$(t.dataset.pane).classList.add('on')});async function load(){let [p,o,s]=await Promise.all([fetch('/api/admin/packages',{headers:H()}),fetch('/api/admin/orders',{headers:H()}),fetch('/api/admin/site-config',{headers:H()})]);if(p.status===401)return logout();renderPackages((await p.json()).packages);renderOrders((await o.json()).orders);fillSite((await s.json()).config)}function fillSite(c){['site_name','tagline','hero_title','hero_subtitle','bank_name','bank_account','bank_owner','support_url','support_text'].forEach(k=>$(k).value=c[k]||'')}async function saveSite(){let b={};['site_name','tagline','hero_title','hero_subtitle','bank_name','bank_account','bank_owner','support_url','support_text'].forEach(k=>b[k]=$(k).value);let r=await fetch('/api/admin/site-config',{method:'POST',headers:H(),body:JSON.stringify(b)});alert(r.ok?'Đã lưu cấu hình':'Không lưu được')}function money(v){return Number(v).toLocaleString('vi-VN')+'đ'}function renderPackages(a){$('packages').innerHTML=a.map(x=>`<div class="row"><b>${x.name}</b><span>${money(x.price)}</span><span>${x.duration_days} ngày</span><span class="muted">${x.description||''}</span><button onclick='edit(${JSON.stringify(x)})'>Sửa</button><button class="danger" onclick="del(${x.id})">Xóa</button></div>`).join('')||'<p class="muted">Chưa có gói.</p>'}function edit(x){$('pid').value=x.id;$('name').value=x.name;$('price').value=x.price;$('days').value=x.duration_days;$('desc').value=x.description||'';$('sort').value=x.sort_order||0;$('active').checked=!!x.active}async function savePackage(){let b={id:$('pid').value?+$('pid').value:null,name:$('name').value,price:+$('price').value,duration_days:+$('days').value,description:$('desc').value,active:$('active').checked,sort_order:+$('sort').value||0};let r=await fetch('/api/admin/packages',{method:'POST',headers:H(),body:JSON.stringify(b)});if(!r.ok)return alert('Không lưu được');$('pid').value='';load()}async function del(id){if(!confirm('Xóa gói này?'))return;await fetch('/api/admin/packages/'+id,{method:'DELETE',headers:H()});load()}function renderOrders(a){$('orders').innerHTML=a.map(x=>`<div class="row order"><b>${x.order_code}</b><span>${x.package_name||'-'}</span><span>${money(x.amount)}</span><span>${x.customer_name||x.user_id||'-'}</span><span>${x.contact||'-'}</span><select onchange="statusOrder(${x.id},this.value)">${['pending','paid','processing','completed','cancelled'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Chưa có đơn.</p>'}async function statusOrder(id,status){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status})});load()}if(key)show();
</script></body></html>
